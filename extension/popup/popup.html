<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SumItUp Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="../icons/icon48.png" alt="SumItUp Logo">
      <div class="title-group">
        <h1>SumItUp</h1>
        <span class="badge">AI Web Summarizer</span>
      </div>
    </div>
  </div>

  <div class="quick-action-box">
    <button id="quick-summarize-btn" class="btn-primary">
      <svg viewBox="0 0 24 24"><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/></svg>
      Summarize Active Tab Now
    </button>
    <div class="shortcut-hint">
      Shortcut: <kbd>Cmd</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd>
    </div>
  </div>

  <div class="section">
    <h2>Configuration</h2>

    <div class="field">
      <label for="api-key">Gemini API Key</label>
      <div class="input-with-button">
        <input type="password" id="api-key" placeholder="Enter your Gemini API key">
        <button id="toggle-key-visibility" class="btn-sm" type="button">👁️</button>
      </div>
      <p class="field-hint">Your API key is stored securely in your browser's local storage.</p>
    </div>

    <div class="field">
      <label for="model-select">Gemini Model</label>
      <select id="model-select">
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite (Fastest & Recommended)</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-flash-latest">Gemini Flash Latest</option>
      </select>
    </div>

    <div class="field toggle-field">
      <label for="floating-icon-toggle">Show Floating Bubble on Webpages</label>
      <input type="checkbox" id="floating-icon-toggle" checked>
    </div>

    <button id="save-settings-btn" class="btn-secondary">Save Settings</button>
    <div id="save-status" class="save-status">Settings saved successfully!</div>
  </div>

  <div class="footer">
    <span>Works like Shazam & Grammarly over any website</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
